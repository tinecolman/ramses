              progress: na
          - file: amr/adaptive_loop.f90
            name: adaptive_loop
            phase: step
            role: driver
            scope: area
            depth: 1
            driver: program
            callers: [program]
            omp:
              state: serial
              progress: na
          - file: amr/amr_step.f90
            name: amr_step
            phase: step
            role: driver
            scope: area
            depth: 2
            driver: adaptive_loop
            callers: [adaptive_loop, amr_step]
            omp:
              state: serial
              progress: done
          - file: amr/amr_step.f90
            name: rt_step
            phase: step
            role: driver
            scope: area
            depth: 3
            driver: amr_step
            callers: [amr_step]
            omp:
