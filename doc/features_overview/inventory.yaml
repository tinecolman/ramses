# RAMSES module inventory
# Feature -> source file -> routine map. Single source of truth for documentation,
# test/benchmark categorisation, and OpenMP status tracking.
#
# Converted from RamsesOpenMPOverview.xlsx (Google Sheets) on 2026-09-09.
# Validate with:  python3 doc/modules_overview/validate_inventory.py
#
# Per routine:
#   phase    params | init | step | output | finalise | any
#            the cross-cutting axis: when in a run the routine executes.
#            Filter on it to see a whole subsystem (all output, all parameter
#            reading) without taking routines away from their feature.
#   driver   amr_step | rt_step | program
#            the routine is an entry point called directly from that driver.
#   depth    shortest call distance from the program entry point; absent only
#            when the routine is never referenced at all (role: unused).
#   callers  routines whose body contains a call to this one. A call resolves to
#            a definition in the same file when there is one, so the two distinct
#            extend_arrays_if_needed routines stay separate. A caller is written
#            file::name when its name is defined in more than one file.
#   todo     something about this routine still needs checking.
#   role     how the routine is reached
#            driver    - an entry point: called directly from the program unit,
#                        adaptive_loop, amr_step or rt_step (see the driver field)
#            recursive - the routine calls itself (its own name is in callers)
#            shared   - two or more callers
#            private  - exactly one caller
#            unused   - never referenced anywhere in the tree
#
#   scope    where those callers live, relative to this routine
#            area     - every caller is in this routine's own area
#            feature  - callers span areas, but stay inside one feature
#            global   - callers span more than one feature. A shared+global
#                       routine called from three or more features is what used
#                       to be labelled "utility"; scope now carries that alone.
#            (absent when there are no callers)
#
#   Function references are resolved as well as `call` statements: a name used
#   as `name(...)`, or passed bare as an actual argument, counts as a call when
#   it matches a function defined in the tree and is not a local array.
#   omp      OpenMP status, derived from the `openmp` branch by derive_omp.py.
#            The public trunk carries no directives at all, so everything here
#            describes that branch. Regenerate with:
#                python3 doc/features_overview/derive_omp.py --write
#
#            state    the routine's relationship to OpenMP threading. RAMSES is
#                     MPI-parallel throughout, so these names say "threads",
#                     never just "parallel":
#
#              opens_region - opens an OpenMP parallel region: threading
#                             starts here
#              adapted      - runs inside someone else's region and was
#                             changed for it (threadprivate, critical/atomic)
#              stateless    - runs inside a region and needed no change: keeps
#                             nothing between calls (no save variables, no
#                             data-initialised locals, no DATA)
#              race         - runs inside a region but keeps written state
#                             between calls that is not threadprivate
#              unthreaded   - never runs inside a parallel region
#
#            `stateless` names exactly what was checked: the declarations in
#            the routine. It does not cover writes to module variables through
#            `use` association, so it is the necessary condition, not a proof.
#
#            regions / threadprivate / sync   directive counts
#            unprotected  the offending variables, when state is unsafe
#
#            Human-owned keys, preserved across regenerations:
#            recorded  the old spreadsheet value for the public version
#            disagrees the recorded value contradicts the derived state
#            na        why this routine does not need OpenMP; takes it out of
#                      the area progress figure
#            verified  a human confirmed the derived state
#            note      free text
#
#   The status dimensions. Each is an optional mapping on a routine, and the
#   page renders a column, a header bar, a legend entry and a filter for every
#   one that has data somewhere in this file. A dimension with no data anywhere
#   is not rendered at all, so a new one costs one entry in DIMS in
#   page/tail.part and nothing else.
#
#   coverage  test coverage of the routine's own lines, written by
#             derive_coverage.py from the run named in coverage_from at the top
#             of this file. Lines behind a preprocessor directive that no build
#             enabled count as uncovered, because RAMSES is recompiled to switch
#             a physics module on.
#               pct covered total notbuilt   the figures
#               status  not_measured, with note saying why
#               na      why coverage does not apply here
#
#   benchmark NOT YET COLLECTED. Same shape as coverage, for the benchmark
#             suite rather than the test suite: which routines any benchmark
#             actually exercises.
#               pct covered total   the figures
#               benchmarks          the benchmark names that reach it
#               na / note           as for coverage
#
#   docs      NOT YET COLLECTED. Whether the routine carries enough
#             documentation to be worked on by someone who did not write it.
#               state   documented | partial | undocumented
#               header  the routine has a header comment block
#               lecture the lecture file that covers it, if any
#               note    free text
#
# Per feature:
#   lecture   space-separated file names under doc/dev_docs/lecture/ that cover
#             this feature, or `none`. `none` marks a real documentation gap.
#   summary   one or two sentences: what this part of the code does. Drafted
#             from the lectures and the wiki, corrected by review.
#   review    present while this feature is being worked through in the current
#             review pass; the text says which pass. Also accepted on an area
#             and on a routine, so a pass can narrow as it goes. The page's
#             "Under review" filter shows exactly what carries it, at any of
#             the three levels. Remove it when the pass is finished -- unlike
#             `todo` it is not a standing note, it is where we are right now.
#
#   Features are listed in the order a run reaches them, and are deliberately
#   not grouped under headings. A top-level split was tried -- first
#   physics / numerics / analysis / infrastructure, then the four toctree
#   captions of doc/dev_docs/lecture/lectures.rst -- and taken out again both
#   times: the code does not partition that way, and the headings read as
#   claims that it does. The clump finder is used by sink formation; the
#   coupling a grouping cannot express is derived from `callers` and shown on
#   each feature instead.

# Standing tasks, carried between review passes.
open_tasks:
  - id: verify-omp-states
    what: >-
      Verify the derived OpenMP state of every routine by hand, feature by
      feature, and record the outcome as `omp: {verified: yes}`. The states are
      derived from the `openmp` branch by derive_omp.py and only inspect each
      routine's own declarations: `stateless` in particular does not cover
      writes to module variables through `use` association.
    raised: 2026-09-10
    progress: "0 / 730 verified"

# Files deliberately left out of the inventory.
excluded_files:
  - path: poisson/multigrid_topdown.f90
    reason: obsolete and unused; the file header says so

# Routines within an area are ordered by phase (params, init, step, output,
# finalise, any), then by call depth, then by order of execution -- the order a
# depth-first walk from the program unit reaches them, following each routine's
# call sites in source order.

