# RAMSES module inventory
# Feature -> source file -> routine map. Single source of truth for documentation,
# test/benchmark categorisation, and OpenMP status tracking.
#
# Converted from RamsesOpenMPOverview.xlsx (Google Sheets) on 2026-09-09.
# Validate with:  python3 doc/modules_overview/validate_inventory.py
#
# Per routine:
#   phase    params | init | step | output | finalise | any
#            the cross-cutting axis: when in a run the routine executes.
#            Filter on it to see a whole subsystem (all output, all parameter
#            reading) without taking routines away from their feature.
#   driver   amr_step | rt_step | program
#            the routine is an entry point called directly from that driver.
#   depth    shortest call distance from amr_step; absent = not reached from
#            the main time-step loop.
#   callers  routines whose body contains a `call` to this one.
#   role     driver     - called directly from amr_step, rt_step or the program unit
#            utility    - called from 3 or more different features
#            shared     - several callers, within one or two features
#            private    - exactly one caller
#            root       - no caller found: an entry point, or dead code
#            unresolved - a Fortran function; a `call`-based scan cannot see its
#                         call sites, so no caller information exists for it
#   omp      OpenMP status per code version, verbatim from the spreadsheet.
#            Absent = not yet assessed. omp_scope: file = the status was asserted
#            for the whole file rather than checked for this routine.

version: 1

features:
  - id: amr_core
    title: "AMR core, grid driver and utilities"
    modules:          # declaration-only modules owned by this feature
      - amr/amr_commons.f90
      - amr/amr_constants.f90
      - amr/amr_parameters.f90
      - amr/constants.f90
      - amr/mpi_mod.f90
    areas:
      - id: main_loop
        title: main time-step driver
        note: "Top-level orchestration; amr_step dispatches into every other feature."
        routines:
          - file: amr/ramses.f90
            name: initialize_mpi
            phase: init
            role: private
            driver: program
            callers: [ramses]
          - file: amr/ramses.f90
            name: set_signal_handler
            phase: init
            role: private
            driver: program
            callers: [ramses]
          - file: amr/ramses.f90
            name: output_signal
            phase: step
            role: root
          - file: amr/adaptive_loop.f90
            name: adaptive_loop
            phase: step
            role: private
            driver: program
            callers: [ramses]
          - file: amr/amr_step.f90
            name: amr_step
            phase: step
            role: driver
            depth: 0
            driver: amr_step
            callers: [adaptive_loop, amr_step]
          - file: amr/init_amr.f90
            name: init_amr
            phase: init
            role: private
            callers: [adaptive_loop]
