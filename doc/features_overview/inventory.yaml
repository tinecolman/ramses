# RAMSES module inventory
# Feature -> source file -> routine map. Single source of truth for documentation,
# test/benchmark categorisation, and OpenMP status tracking.
#
# Converted from RamsesOpenMPOverview.xlsx (Google Sheets) on 2026-09-09.
# Validate with:  python3 doc/modules_overview/validate_inventory.py
#
# Per routine:
#   phase    params | init | step | output | finalise | any
#            the cross-cutting axis: when in a run the routine executes.
#            Filter on it to see a whole subsystem (all output, all parameter
#            reading) without taking routines away from their feature.
#   driver   amr_step | rt_step | program
#            the routine is an entry point called directly from that driver.
#   depth    shortest call distance from the program entry point; absent only
#            when the routine is never referenced at all (role: unused).
#   callers  routines whose body contains a call to this one. A call resolves to
#            a definition in the same file when there is one, so the two distinct
#            extend_arrays_if_needed routines stay separate. A caller is written
#            file::name when its name is defined in more than one file.
#   todo     something about this routine still needs checking.
#   role     how the routine is reached
#            driver    - an entry point: called directly from the program unit,
#                        adaptive_loop, amr_step or rt_step (see the driver field)
#            recursive - the routine calls itself (its own name is in callers)
#            shared   - two or more callers
#            private  - exactly one caller
#            unused   - never referenced anywhere in the tree
#
#   scope    where those callers live, relative to this routine
#            area     - every caller is in this routine's own area
#            feature  - callers span areas, but stay inside one feature
#            global   - callers span more than one feature. A shared+global
#                       routine called from three or more features is what used
#                       to be labelled "utility"; scope now carries that alone.
#            (absent when there are no callers)
#
#   Function references are resolved as well as `call` statements: a name used
#   as `name(...)`, or passed bare as an actual argument, counts as a call when
#   it matches a function defined in the tree and is not a local array.
#   omp      OpenMP status, derived from the `openmp` branch by derive_omp.py.
#            The public trunk carries no directives at all, so everything here
#            describes that branch. Regenerate with:
#                python3 doc/features_overview/derive_omp.py --write
#
#            state    parallel - opens an OpenMP parallel region
#                     threaded - adapted to run inside one (threadprivate,
#                                critical/atomic), but opens none itself
#                     safe     - runs inside a region and needs no adaptation:
#                                no save variables, no data-initialised locals
#                     unsafe   - runs inside a region but keeps state between
#                                calls that is not threadprivate: a race
#                     serial   - never runs inside a parallel region
#            `safe` is inferred, not verified: no shared mutable state was
#            found, which is necessary but not sufficient.
#
#            regions / threadprivate / sync   directive counts
#            unprotected  the offending variables, when state is unsafe
#
#            Human-owned keys, preserved across regenerations:
#            recorded  the old spreadsheet value for the public version
#            disagrees the recorded value contradicts the derived state
#            na        why this routine does not need OpenMP; takes it out of
#                      the area progress figure
#            verified  a human confirmed the derived state
#            note      free text

# Files deliberately left out of the inventory.
excluded_files:
  - path: poisson/multigrid_topdown.f90
    reason: obsolete and unused; the file header says so

# Routines within an area are ordered by phase (params, init, step, output,
# finalise, any), then by call depth, then by order of execution -- the order a
# depth-first walk from the program unit reaches them, following each routine's
# call sites in source order.

version: 1

features:
  - id: amr_core
    title: "AMR core, grid driver and utilities"
    modules:          # declaration-only modules owned by this feature
      - amr/amr_commons.f90
      - amr/amr_constants.f90
      - amr/amr_parameters.f90
      - amr/constants.f90
      - amr/mpi_mod.f90
    areas:
      - id: main_loop
        title: main time-step driver
        note: "Top-level orchestration; amr_step dispatches into every other feature."
        routines:
          - file: amr/ramses.f90
            name: initialize_mpi
            phase: init
            role: driver
            scope: area
            depth: 1
            driver: program
            callers: [program]
            omp:
              state: parallel
              progress: done
              regions: 1
          - file: amr/ramses.f90
            name: set_signal_handler
            phase: init
            role: driver
            scope: area
            depth: 1
            driver: program
            callers: [program]
            omp:
              state: serial
              progress: na
          - file: amr/init_amr.f90
            name: init_amr
            phase: init
            role: driver
            scope: area
            depth: 2
            driver: adaptive_loop
            callers: [adaptive_loop]
            omp:
              state: serial
              progress: na
              recorded: "todo"
              disagrees: true
              note: assignement after reading restart could be openmp
          - file: amr/init_refine.f90
            name: init_refine
            phase: init
            role: driver
            scope: area
            depth: 2
            driver: adaptive_loop
            callers: [adaptive_loop]
            omp:
              state: serial
              progress: na
          - file: amr/init_refine.f90
