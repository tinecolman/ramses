  - id: clumps
    title: "Clump finding (PHEW)"
    lecture: none
    summary: >-
      PHEW, the on-the-fly clump finder: locates density peaks, segments the
      grid into their watershed basins, merges them across saddle points
      against a noise threshold, and computes their properties. It is used on
      its own, and as the halo finder that feeds merger trees and sink
      creation.
    areas:
      - id: peak_finding
        title: density peak identification and segmentation
        routines:
          - file: pm/clump_finder.f90
            name: read_clumpfind_params
