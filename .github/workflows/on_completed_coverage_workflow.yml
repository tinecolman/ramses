name: on PR coverage (completed)

# Posts the coverage comment made by "Coverage (PR)" on the pull request and
# removes the "coverage" label that requested it, so that adding the label
# again requests a new estimate. Same pattern as on_completed_pr_workflow.yml:
# a workflow_run has the permissions that a pull_request from a fork does not.

on:
  workflow_run:
    workflows: ['Coverage (PR)']
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment_with_coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Download the comment artifact
        id: download
        uses: actions/github-script@v6
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
            });
            let matching = allArtifacts.data.artifacts.filter((a) => a.name == "coverage-comment");
            if (matching.length == 0) {
              // the run was not requested by the label: nothing to post
              core.info("no coverage-comment artifact");
              core.setOutput("found", "false");
              return;
            }
            core.setOutput("found", "true");
            let download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matching[0].id,
              archive_format: 'zip',
            });
            require('fs').writeFileSync(`${process.env.GITHUB_WORKSPACE}/coverage-comment.zip`, Buffer.from(download.data));
      - if: steps.download.outputs.found == 'true'
        run: unzip -o coverage-comment.zip -d .
      - name: Read PR number
        if: steps.download.outputs.found == 'true'
        id: read_pr
        run: echo "pr_number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: steps.download.outputs.found == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: coverage_comment.md
          comment-tag: coverage_report
          mode: recreate
          create-if-not-exists: true
          pr-number: ${{ steps.read_pr.outputs.pr_number }}
      - name: Remove the label that requested the estimate
        if: steps.download.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # the REST endpoint: `gh pr edit --remove-label` currently fails on a
        # deprecated GraphQL field
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ steps.read_pr.outputs.pr_number }}/labels/coverage" > /dev/null
