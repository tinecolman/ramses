name: Coverage (full)

# Full coverage run of the test suite on dev: every test, gcov build (-O0).
# Publishes the result as the coverage baseline of the commit (replacing the
# rolling one made by "Coverage (dev)" for the same commit) and reports how far
# the rolling baseline had drifted from it. Monthly, or by hand.

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:

  run:
    name: "Coverage ${{ matrix.test-family }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-family: [hydro, mhd, poisson, rt, sink, star, turb, tracer]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI and FFTW
        run: sudo apt-get install -y openmpi-bin libopenmpi-dev libfftw3-bin libfftw3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r .github/workflows/requirements.txt
      - uses: wtfjoke/setup-tectonic@v3
        with:
          tectonic-version: 0.15.0
      - uses: pyvista/setup-headless-display-action@v3
      - name: "Run tests ${{ matrix.test-family }} with coverage"
        run: |
          cd tests
          bash run_test_suite.sh -s -p 2 -v -t ${{ matrix.test-family }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "coverage-run-${{ matrix.test-family }}"
          path: tests/coverage_*/**
          include-hidden-files: true

  publish:
    name: Aggregate and publish
    needs: run
    # A test that fails its comparison still leaves valid coverage data, and
    # the test workflows report failures; only a cancelled run is not published.
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y zstd
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-run-*
          path: runs
      - name: Aggregate the families
        run: |
          mkdir -p tests/full/gcov_per_test tests/full/build_records
          for d in $(find runs -type d -name gcov_per_test); do
            r=$(dirname "$d")
            fam=$(basename "$(dirname "$r")"); fam=${fam#coverage-run-}
            cp -r "$d"/* tests/full/gcov_per_test/
            for f in "$r"/build_records/*.txt; do
              cat "$f" >> tests/full/build_records/$(basename "$f")
            done
            # the families started within the same second: name their logs
            for f in "$r"/test_suite_*.log; do cp "$f" "tests/full/test_suite_${fam}_${f##*test_suite_}"; done
            for f in "$r"/test_results_*.pdf; do cp "$f" "tests/full/test_results_${fam}_${f##*test_results_}"; done
          done
          cd tests
          {
            echo "# Full coverage run of the test suite (workflow Coverage (full))."
            echo ""
            echo "date          : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "kind          : full"
            echo "branch        : ${GITHUB_REF_NAME}"
            echo "commit        : ${GITHUB_SHA}"
            echo "commit_short  : ${GITHUB_SHA:0:8}"
            echo "commit_date   : $(git log -1 --format=%cd --date=format:%Y-%m-%d)"
            echo "repository    : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "ntests        : $(ls -d full/gcov_per_test/*/ | wc -l)"
            echo "gcov          : $(gcov --version | head -1)"
            echo "compiler      : $(gfortran --version | head -1)"
          } > full/coverage_metadata.txt
          python3 multi_gcov_aggregator.py full/gcov_per_test/*/ full --build-records full/build_records
          tail -3 full/coverage_report.txt
          {
            echo "## Full coverage of ${GITHUB_REF_NAME} at ${GITHUB_SHA:0:10}"
            echo "Families with data: $(ls -d ../runs/*/ | xargs -n1 basename | sed 's/coverage-run-//' | tr '\n' ' ') (expected 8)"
            echo "Tests: $(ls -d full/gcov_per_test/*/ | wc -l); failed comparisons: $(cat full/test_suite_*.log | grep -c '\[FAIL\]' || true)"
            cat full/test_suite_*.log | grep '\[FAIL\]' | sed 's/^/    /' || true
            echo ""
            echo '```'
            tail -1 full/coverage_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # kept so that a failed publish can be redone by hand from the artifact
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-full
          path: tests/full
          include-hidden-files: true
      - name: Drift of the rolling baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tests
          if found=$(bash coverage_baseline.sh find "${GITHUB_SHA}"); then
            sha=${found%% *}; lag=${found##* }
            bash coverage_baseline.sh fetch "$sha" rolling
            {
              echo "## Rolling baseline vs this full run"
              echo "Rolling baseline of ${sha:0:10}, ${lag} commit(s) before this one. Its difference from the full run is the error of the incremental updates since the last full run."
              echo ""
              python3 coverage_diff.py rolling full --markdown
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No rolling baseline to compare with." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish as the baseline of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tests
          bash coverage_baseline.sh publish full "${GITHUB_SHA}" full
          bash coverage_baseline.sh prune
      # The number goes to a tracking issue, so that its subscribers (and the
      # handles in the repository variable COVERAGE_NOTIFY, e.g. "@someone")
      # get it by mail and the issue keeps the history.
      # the label that requests a coverage estimate on a pull request
      - name: Make sure the "coverage" label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create coverage --description "Request a test-suite coverage estimate for this pull request" --color 0E8A16 --force
      - name: Report on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: ${{ vars.COVERAGE_NOTIFY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd tests
          title="Test-suite coverage tracking"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                   -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$number" ]; then
            number=$(gh issue create --title "$title" \
                --body "Monthly result of the full coverage run of the test suite (workflow Coverage (full)). Subscribe to this issue to get the number by mail." \
                | grep -o '[0-9]*$')
          fi
          {
            echo "Full coverage run of ${GITHUB_REF_NAME} at ${GITHUB_SHA:0:10} ([run](${RUN_URL})):"
            echo ""
            echo '```'
            tail -1 full/coverage_report.txt
            echo '```'
            if [ -d rolling ]; then
              echo ""
              python3 coverage_diff.py rolling full --markdown | sed -n '1p'
              echo "(rolling baseline vs this full run: the error of the incremental updates)"
            fi
            [ -n "$NOTIFY" ] && echo "" && echo "$NOTIFY"
          } > issue_comment.md
          gh issue comment "$number" --body-file issue_comment.md
